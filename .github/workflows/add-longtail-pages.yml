name: Add Long-tail Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-longtail-pages.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate long-tail SEO pages
        run: node scripts/add-longtail-pages.js
      - name: Commit long-tail pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add long-tail SEO landing pages"
            git push
          fi
