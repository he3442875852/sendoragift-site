          replace_once('sitemap.xml', '  <url><loc>https://www.sendoragift.com/about/</loc><lastmod>2026-06-29</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>\n', '  <url><loc>https://www.sendoragift.com/about/</loc><lastmod>2026-06-29</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>\n  <url><loc>https://www.sendoragift.com/trust-center/</loc><lastmod>2026-06-29</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>\n')

          # Remove this temporary workflow after it has applied the static changes.
          Path('.github/workflows/codex-apply-sendora-geo.yml').unlink(missing_ok=True)
      - name: Validate changed files
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          pages = ['index.html','corporate-gift.html','client-thank-you-gift-boxes.html','employee-welcome.html','about/index.html','trust-center/index.html']
          for page in pages:
              text = Path(page).read_text(encoding='utf-8')
              assert len(re.findall(r'<h1(?:\s|>)', text)) == 1, f'{page} should have exactly one H1'
          assert '3&ndash; weeks' not in Path('employee-welcome.html').read_text(encoding='utf-8')
          assert 'https://gelinhong.en.alibaba.com/' in Path('trust-center/index.html').read_text(encoding='utf-8')
          ET.parse('sitemap.xml')
      - name: Commit applied optimization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "codex-agent"
          git config user.email "codex-agent@users.noreply.github.com"
          git add index.html assets/home-v5.css corporate-gift.html client-thank-you-gift-boxes.html employee-welcome.html about/index.html trust-center/index.html sitemap.xml .github/workflows/codex-apply-sendora-geo.yml
          git commit -m "Apply Sendora GEO trust optimization"
          git push origin HEAD:codex/sendora-geo-trust-optimization
