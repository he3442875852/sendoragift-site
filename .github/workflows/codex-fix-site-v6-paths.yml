name: Codex fix site-v6 paths

on:
  push:
    branches: [codex/geo-trust-optimization]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/geo-trust-optimization
      - name: Fix relative stylesheet paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.').resolve()
          for f in root.rglob('*.html'):
              if '.git' in f.parts:
                  continue
              rel = f.relative_to(root)
              depth = len(rel.parts) - 1
              href = 'assets/site-v6.css' if depth == 0 else '../' * depth + 'assets/site-v6.css'
              text = f.read_text(encoding='utf-8')
              text = re.sub(r'<link rel="stylesheet" href="(?:\.\./)*assets/site-v6\.css">', f'<link rel="stylesheet" href="{href}">', text)
              if 'assets/site-v6.css' not in text:
                  text = text.replace('</head>', f'  <link rel="stylesheet" href="{href}">\n</head>', 1)
              f.write_text(text, encoding='utf-8')
          PY
      - name: Audit optimized site
        run: python scripts/audit_site.py
      - name: Commit CSS path fix
        run: |
          rm -f .github/workflows/codex-fix-site-v6-paths.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix shared CSS paths for nested pages"
            git push origin codex/geo-trust-optimization
          fi
