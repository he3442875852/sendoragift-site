name: Codex remove internal buyer copy

on:
  push:
    branches:
      - codex/remove-buyer-internal-copy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-buyer-internal-copy
      - name: Remove internal-facing buyer copy
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          t = index.read_text(encoding='utf-8')
          marker = '<section class="proof-grid">\n  <article><h2>What Buyers Can Verify</h2>'
          if marker in t:
              start = t.index(marker)
              end = t.index('</section>', start) + len('</section>')
              while end < len(t) and t[end] in '\r\n':
                  end += 1
              t = t[:start] + t[end:]
          index.write_text(t, encoding='utf-8')

          trust = Path('trust-center/index.html')
          t = trust.read_text(encoding='utf-8')
          t = t.replace('Trust Center | Sendora Gift', 'Contact and Company Details | Sendora Gift')
          t = t.replace('Verified company identity, contact details, Alibaba profile and publishing rules for Sendora Gift corporate gift buyers.', 'Confirmed Sendora Gift company details, contact email, WhatsApp and Alibaba supplier profile for corporate gift buyers.')
          t = t.replace('<h1>Trust Center</h1>', '<h1>Contact and Company Details</h1>')
          t = t.replace('Use this page to verify the confirmed public business details for Sendora Gift before sending an RFQ or sharing project files.', 'Here are the confirmed business details for Sendora Gift. Share your quantity, target budget, logo needs and delivery country, and our team will help you plan a practical corporate gift solution.')
          start_marker = '<section class="proof-grid">\n  <article><h2>Evidence Boundary</h2>'
          if start_marker in t:
              start = t.index(start_marker)
              end = t.index('</section>', start) + len('</section>')
              new = '<section class="proof-grid">\n  <article><h2>Project Support</h2><p>We help compare gift ideas, logo methods, packaging options, sample details and delivery requirements before bulk production.</p></article>\n  <article><h2>Fast RFQ Review</h2><p>Send your quantity, product direction, logo file, destination and deadline so we can prepare a practical recommendation and price range.</p></article>\n  <article><h2>Direct Communication</h2><p>You can reach us by email, WhatsApp or Alibaba to discuss samples, packaging details and next production steps.</p></article>\n</section>'
              t = t[:start] + new + t[end:]
          trust.write_text(t, encoding='utf-8')
          PY
      - name: Audit site
        run: python scripts/audit_site.py
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/codex-remove-internal-buyer-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove internal-facing trust copy from buyer pages"
            git push origin codex/remove-buyer-internal-copy
          fi
