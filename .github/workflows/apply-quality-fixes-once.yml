name: Apply one-time site quality fixes

on:
  push:
    branches:
      - codex/fix-site-quality-audit
    paths:
      - '.github/workflows/apply-quality-fixes-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-site-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-site-quality-audit
      - name: Apply verified quality fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          privacy_consent = '<label class="privacy-consent"><input type="checkbox" name="privacy_consent" required> I have read and agree to the <a href="/privacy-policy.html">Privacy Policy</a>.</label>'
          gotcha = '<input class="hidden-field" type="text" name="_gotcha" tabindex="-1" autocomplete="off">'

          def fix_form(match):
              form = match.group(0)
              next_form = form
              if not re.search(r'name=["\']_gotcha["\']', next_form, re.I):
                  next_form = re.sub(r'(<form\b[^>]*>)', r'\1' + gotcha, next_form, count=1, flags=re.I)
              if not re.search(r'name=["\']privacy_consent["\']', next_form, re.I) and 'privacy-policy.html' not in next_form.lower():
                  if re.search(r'<button\b[^>]*type=["\']submit["\']', next_form, re.I):
                      next_form = re.sub(r'(<button\b[^>]*type=["\']submit["\'][^>]*>)', privacy_consent + r'\1', next_form, count=1, flags=re.I)
                  elif re.search(r'<button\b', next_form, re.I):
                      next_form = re.sub(r'(<button\b[^>]*>)', privacy_consent + r'\1', next_form, count=1, flags=re.I)
                  elif re.search(r'<input\b[^>]*type=["\']submit["\']', next_form, re.I):
                      next_form = re.sub(r'(<input\b[^>]*type=["\']submit["\'][^>]*>)', privacy_consent + r'\1', next_form, count=1, flags=re.I)
                  else:
                      next_form = re.sub(r'</form>', privacy_consent + r'</form>', next_form, count=1, flags=re.I)
              return next_form

          for path in root.rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              before = text
              text = text.replace(' 路 ', ' · ')
              text = text.replace('��', '·')
              text = re.sub(r'\sdata-seo(?:-[a-z0-9_-]+)?=(["\']).*?\1', '', text, flags=re.I | re.S)
              text = re.sub(r'\sdata-content-expansion=(["\']).*?\1', '', text, flags=re.I | re.S)
              text = re.sub(r'\sdata-final-expansion=(["\']).*?\1', '', text, flags=re.I | re.S)
              text = re.sub(r'\sdata-seo-schema=(["\']).*?\1', '', text, flags=re.I | re.S)
              text = re.sub(r'<form\b[\s\S]*?</form>', fix_form, text, flags=re.I)
              if text != before:
                  path.write_text(text, encoding='utf-8')

          privacy = Path('privacy-policy.html')
          if privacy.exists():
              text = privacy.read_text(encoding='utf-8')
              text = text.replace('Shenzhen Gelinhong Technology Co., Ltd..', 'Shenzhen Gelinhong Technology Co., Ltd.')
              text = text.replace('We may collect your name, company, country, email, WhatsApp number, project details, quantity, destination, deadline and uploaded reference files.', 'We may collect your name, company, country, email address, WhatsApp or phone number, project details, quantity, target budget, delivery destination, deadline and uploaded logo or reference files.')
              text = text.replace('We use this information to reply to RFQs, prepare quotations, discuss samples, coordinate packaging and delivery requirements, and maintain project communication.', 'We use this information to reply to RFQs, prepare quotations, recommend products, discuss samples, review logo and packaging requirements, coordinate delivery planning and maintain project communication.')
              if 'Website and Lead Source Tracking' not in text:
                  text = text.replace('<h2>Sharing</h2>', '<h2>Website and Lead Source Tracking</h2>\n  <p>Our website may store basic lead source information such as landing page, referrer, UTM parameters, browser language, timezone and recent page path history in localStorage or sessionStorage. This helps us understand which page or campaign generated an inquiry and respond with more relevant product suggestions.</p>\n  <h2>File Uploads</h2>\n  <p>If you upload a logo, artwork, reference image or project file, we use it only to review customization feasibility, quote the project or discuss sample details. Please do not upload files that you are not authorized to share.</p>\n  <h2>Service Providers and Communication Channels</h2>\n  <p>Inquiry forms may be processed through Formspree. Website hosting is provided by Vercel. Buyers may also choose to contact us through WhatsApp or Alibaba. These third-party services process information under their own terms and privacy policies.</p>\n  <h2>Sharing and Production Support</h2>')
                  text = text.replace('  <h2>Contact</h2>', '  <h2>Retention</h2>\n  <p>We keep inquiry and project records for as long as reasonably needed to respond to requests, support repeat orders, maintain business records or comply with legal obligations.</p>\n  <h2>Your Choices</h2>\n  <p>You may request access, correction or deletion of your inquiry information by contacting us. Some records may need to be retained when required for legitimate business, accounting or legal reasons.</p>\n  <h2>Contact</h2>')
              privacy.write_text(text, encoding='utf-8')

          vercel = Path('vercel.json')
          data = json.loads(vercel.read_text(encoding='utf-8'))
          headers = data.setdefault('headers', [])
          all_headers = next((item for item in headers if item.get('source') == '/(.*)'), None)
          if all_headers is None:
              all_headers = {'source': '/(.*)', 'headers': []}
              headers.insert(0, all_headers)
          desired = {
              'X-Content-Type-Options': 'nosniff',
              'Referrer-Policy': 'strict-origin-when-cross-origin',
              'Permissions-Policy': 'camera=(), microphone=(), geolocation=()',
              'X-Frame-Options': 'DENY',
              'Content-Security-Policy': "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; form-action 'self' https://formspree.io; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'",
          }
          existing = {h.get('key'): h for h in all_headers.setdefault('headers', [])}
          for key, value in desired.items():
              if key in existing:
                  existing[key]['value'] = value
              else:
                  all_headers['headers'].append({'key': key, 'value': value})
          assets = next((item for item in headers if item.get('source') == '/assets/(.*)'), None)
          if assets:
              for h in assets.get('headers', []):
                  if h.get('key') == 'Cache-Control':
                      h['value'] = 'public, max-age=31536000, immutable'
          vercel.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/apply-quality-fixes-once.yml').unlink(missing_ok=True)
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix site quality audit issues"
          git push origin HEAD:codex/fix-site-quality-audit
