name: Add homepage gallery section
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-gallery-images.yml'
permissions:
  contents: write
jobs:
  add-gallery-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert homepage gallery section
        run: |
          python3 <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          css = '''
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;}
.gallery-card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.gallery-card img{width:100%;height:220px;object-fit:cover;display:block;}
.gallery-card-content{padding:18px;}
.gallery-card-content h3{font-size:20px;color:#222;margin-bottom:10px;}
.gallery-card-content p{font-size:15px;color:#555;}
'''
          gallery = '''
<section id="gallery">
<h2>Custom Gift Set Gallery</h2>
<div class="container gallery-grid">
<div class="gallery-card"><img src="assets/custom-luxury-gift-box-packaging.jpg" alt="custom luxury gift box packaging with branded bag and ribbon" loading="lazy"><div class="gallery-card-content"><h3>Premium Gift Box Packaging</h3><p>Custom boxes, bags, ribbons, inserts and greeting cards for a polished unboxing experience.</p></div></div>
<div class="gallery-card"><img src="assets/corporate-gift-set-use-cases.jpg" alt="corporate gift set examples for welcome kits conferences holiday gifts and onboarding" loading="lazy"><div class="gallery-card-content"><h3>Gift Sets for Different Use Cases</h3><p>Welcome kits, conference giveaways, holiday gifts and onboarding kits can be built around your brand.</p></div></div>
<div class="gallery-card"><img src="assets/oem-odm-logo-customization-gifts.jpg" alt="one stop OEM ODM logo customization methods for corporate gifts" loading="lazy"><div class="gallery-card-content"><h3>One-Stop Logo Customization</h3><p>Screen printing, laser engraving, embroidery and custom stickers for different product materials.</p></div></div>
<div class="gallery-card"><img src="assets/branded-tumbler-notebook-gift-set.jpg" alt="branded tumbler notebook pen and custom gift box set" loading="lazy"><div class="gallery-card-content"><h3>Branded Tumbler and Notebook Set</h3><p>A practical corporate gift set for employees, clients, events and appreciation programs.</p></div></div>
</div>
</section>
'''
          if '.gallery-grid' not in text:
              text = text.replace('</style>', css + '\n</style>')
          if 'Custom Gift Set Gallery' not in text:
              text = text.replace('<section id="products">', gallery + '\n<section id="products">')
          index.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then echo "No homepage gallery changes needed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add homepage custom gift set gallery"
          git push
