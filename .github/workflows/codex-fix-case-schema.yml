name: Codex fix case schema wording

on:
  push:
    branches: [codex/geo-trust-optimization]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/geo-trust-optimization
      - name: Fix case schema wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cases/index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('Custom corporate gift case studies for B2B buyers.','Custom corporate gift sample references for B2B buyer planning.')
          t=t.replace('<h2>Project Examples</h2>','<h2>Sample Reference Examples</h2>')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Audit optimized site
        run: python scripts/audit_site.py
      - name: Commit case schema wording fix
        run: |
          rm -f .github/workflows/codex-fix-case-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clean case reference wording"
            git push origin codex/geo-trust-optimization
          fi
