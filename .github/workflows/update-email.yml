name: Update Email

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-email.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update email address
        run: node scripts/update-email.js
      - name: Commit email updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html corporate-gift.html employee-welcome.html promotional-giveaways.html event-gift.html executive-gift.html conference-gift.html sports-event.html holiday-gift.html scripts/update-email.js .github/workflows/update-email.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update site email address"
            git push
          fi
