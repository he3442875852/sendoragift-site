name: Replace Images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/replace-images.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download premium assets and update pages
        run: node scripts/replace-images.js
      - name: Commit premium image updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace site images with premium generated assets"
            git push
          fi
