name: Product SEO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/product-seo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SEO updater
        run: node scripts/apply-product-seo.js
      - name: Commit product SEO updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corporate-gift.html employee-welcome.html promotional-giveaways.html event-gift.html executive-gift.html conference-gift.html sports-event.html holiday-gift.html scripts/apply-product-seo.js .github/workflows/product-seo.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Enhance product page SEO"
            git push
          fi
