name: Fix image aspect ratios

on:
  push:
    branches:
      - codex/sendora-geo-trust-optimization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sendora-geo-trust-optimization
      - name: Apply image aspect ratio safeguards
        shell: python
        run: |
          from pathlib import Path
          import re
          rule = 'img{max-width:100%;height:auto;display:block}'
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if '<style>' not in text:
                  continue
              if 'img{max-width:100%;height:auto' in text or 'img{max-width:100%; height:auto' in text:
                  continue
              updated = text.replace('<style>', '<style>' + rule, 1)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')
                  changed.append(str(path))

          for css_path in [Path('assets/home-v5.css'), Path('assets/styles.css')]:
              if not css_path.exists():
                  continue
              text = css_path.read_text(encoding='utf-8')
              updated = text
              if 'img{max-width:100%;height:auto;display:block}' not in updated:
                  updated = 'img{max-width:100%;height:auto;display:block}\n' + updated
              updated = updated.replace('.home-page img {\n  display: block;\n  max-width: 100%;\n}', '.home-page img {\n  display: block;\n  max-width: 100%;\n  height: auto;\n}')
              if updated != text:
                  css_path.write_text(updated, encoding='utf-8', newline='')
                  changed.append(str(css_path))

          # Keep intentionally cropped art directed blocks intact.
          for page in ['trust-center/index.html', 'index.html']:
              text = Path(page).read_text(encoding='utf-8')
              assert 'height:auto' in text or 'height: auto' in text, page
          Path('.github/workflows/codex-fix-image-aspect.yml').unlink(missing_ok=True)
          print('changed files:', len(changed))
          for item in changed[:80]:
              print(item)
      - name: Commit image aspect fix
        shell: bash
        run: |
          git config user.name "codex-agent"
          git config user.email "codex-agent@users.noreply.github.com"
          git add .
          git commit -m "Fix image aspect ratio safeguards"
          git push origin HEAD:codex/sendora-geo-trust-optimization
